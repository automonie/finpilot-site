name: Test Automonie Content App

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-content-access:
    runs-on: ubuntu-latest

    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.AUTOMONIE_CONTENT_APP_CLIENT_ID }}
          private-key: ${{ secrets.AUTOMONIE_CONTENT_APP_PRIVATE_KEY }}
          owner: automonie
          repositories: automonie-content

      - name: Check access to content repository
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          echo "Testing access to automonie/autonomie-content..."
          gh api /repos/automonie/autonomie-content \
            --jq '{name: .name, private: .private, default_branch: .default_branch}'

      - name: List content files
        uses: actions/checkout@v6
        with:
          repository: automonie/autonomie-content
          token: ${{ steps.app-token.outputs.token }}
          path: content

      - name: Confirm files
        run: |
          echo "Content repository successfully accessed."
          echo
          echo "Files:"
          find content -maxdepth 3 -type f -print
